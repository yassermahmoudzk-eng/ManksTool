name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # يسمح بالتشغيل اليدوي من صفحة Actions

jobs:
  build-android:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev \
            libsqlite3-dev sqlite3 bzip2 libbz2-dev \
            libreadline-dev libgdbm-dev tk-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36 virtualenv

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mankstool-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
